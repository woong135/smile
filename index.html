<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>실시간 웃음인식 챌린지 😊</title>
    
    <!-- 아이패드 사파리 호환성 검증 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-color: #12121a;
            --card-bg: #1e1e2f;
            --accent-color: #ffb703;
            --text-main: #ffffff;
            --text-muted: #a0a0b5;
        }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px 24px;
            width: 90%; max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        h1 { color: var(--accent-color); margin: 0 0 8px 0; font-size: 1.8rem; }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }
        .video-wrapper {
            position: relative; width: 100%; aspect-ratio: 4/3;
            background: #000; border-radius: 16px; overflow: hidden;
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .overlay-loading {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--card-bg); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255, 183, 3, 0.1);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .score-box {
            margin-top: 24px; background: rgba(0, 0, 0, 0.2);
            padding: 12px 30px; border-radius: 50px;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .score-number { font-size: 3rem; font-weight: 900; }
        .score-unit { font-size: 1.4rem; color: var(--accent-color); font-weight: 700; margin-top: 10px; }
        .gauge-container {
            width: 90%; height: 14px; background: #2a2a3a;
            border-radius: 7px; margin: 24px auto 12px auto; overflow: hidden;
        }
        .gauge-bar {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, #ff4b5c, #ffb703, #1dd1a1);
            transition: width 0.1s ease-out;
        }
        .msg-display { font-size: 1rem; font-weight: 700; height: 26px; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="container">
        <h1>웃음대회 챌린지 😈</h1>
        <div class="subtitle">어설픈 미소는 통하지 않는 핵매운맛 모드!</div>
        
        <div class="video-wrapper">
            <div id="loader" class="overlay-loading">
                <div class="spinner"></div>
                <div style="font-size: 0.9rem; color: var(--text-muted);">보안 AI 엔진 구동 중...</div>
            </div>
            <video id="webcam" autoplay playsinline muted></video>
        </div>

        <div class="score-box">
            <span class="score-number" id="score-value">0</span>
            <span class="score-unit">점</span>
        </div>

        <div class="gauge-container">
            <div class="gauge-bar" id="progress"></div>
        </div>

        <div class="msg-display" id="status">카메라 준비 중...</div>
    </div>

    <script>
        const video = document.getElementById("webcam");
        const scoreEl = document.getElementById("score-value");
        const progressBar = document.getElementById("progress");
        const statusEl = document.getElementById("status");
        const loader = document.getElementById("loader");

        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: false,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        faceMesh.onResults((results) => {
            loader.style.display = "none";

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                
                const mouthLeft = landmarks[61];
                const mouthRight = landmarks[291];
                const eyeLeft = landmarks[33];
                const eyeRight = landmarks[263];

                const mouthWidth = Math.hypot(mouthLeft.x - mouthRight.x, mouthLeft.y - mouthRight.y);
                const eyeDist = Math.hypot(eyeLeft.x - eyeRight.x, eyeLeft.y - eyeRight.y);
                const smileRatio = mouthWidth / eyeDist;

                // =======================================================
                // 🛠️ [핵매운맛 알고리즘 핵심 변경]
                // 1. 컷트라인 상향: 기존 0.46에서 0.49로 베이스를 대폭 올림 (무표정 방어)
                // 2. 비선형(제곱) 스케일링: 중간까지는 점수가 기어 다니게 설계
                // =======================================================
                let rawProgress = (smileRatio - 0.49) / 0.25; 
                
                if (rawProgress < 0) rawProgress = 0;
                if (rawProgress > 1) rawProgress = 1;

                // 제곱 계산 적용 (예: 진행도가 50%일 때, 기존엔 50점이었으나 이제는 25점이 됨)
                let score = Math.round(Math.pow(rawProgress, 2) * 100);

                scoreEl.innerText = score;
                progressBar.style.width = `${score}%`;

                // 점수별 멘트 리액션
                if (score < 15) {
                    statusEl.innerText = "웃으세요! 꼼수는 통하지 않습니다 😐";
                    statusEl.style.color = "#a0a0b5";
                } else if (score < 50) {
                    statusEl.innerText = "겨우 그 정도로 100점을 바라면 오산! 🙂";
                    statusEl.style.color = "#ffb703";
                } else if (score < 88) {
                    statusEl.innerText = "더 찢으세요! 광대 터지도록 박장대소! 😀";
                    statusEl.style.color = "#1dd1a1";
                } else {
                    statusEl.innerText = "지옥 모드 격파! 진정한 웃음의 왕! 🎉👑";
                    statusEl.style.color = "#1dd1a1";
                }
            } else {
                statusEl.innerText = "화면을 제대로 바라봐 주세요.";
                statusEl.style.color = "#a0a0b5";
            }
        });

        const camera = new Camera(video, {
            onFrame: async () => { await faceMesh.send({ image: video }); },
            width: 640, height: 480
        });
        camera.start().catch(err => { alert("카메라를 켤 수 없습니다."); });
    </script>
</body>
</html>
