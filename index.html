<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>실시간 웃음인식 챌린지 😊</title>
    
    <!-- 아이패드 사파리 호환성 검증 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-color: #0d0d13;
            --card-bg: #161622;
            --accent-color: #ffb703;
            --text-main: #ffffff;
            --text-muted: #8e8e9f;
        }
        body {
            margin: 0; padding: 20px 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        
        .container {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            width: 95%; max-width: 650px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 183, 3, 0.1);
            box-sizing: border-box;
        }
        h1 { color: var(--accent-color); margin: 0 0 4px 0; font-size: 1.8rem; }
        .subtitle { color: #ff3e3e; font-size: 0.9rem; margin-bottom: 16px; font-weight: bold; }
        
        .video-wrapper {
            position: relative; width: 100%; aspect-ratio: 4/3;
            background: #000; border-radius: 16px; overflow: hidden;
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        .overlay-loading {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--card-bg); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255, 183, 3, 0.1);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .score-display-container {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 16px;
        }
        .score-box {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 8px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .score-box.highlight {
            border: 1px solid rgba(255, 183, 3, 0.4);
            background: rgba(255, 183, 3, 0.05);
        }
        .score-label { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
        .score-box.highlight .score-label { color: var(--accent-color); font-weight: bold; }
        
        .score-number { 
            font-size: 2.8rem; 
            font-weight: 900; 
            color: #ffffff;
            font-variant-numeric: tabular-nums; 
        }
        .score-unit { font-size: 1.2rem; color: var(--accent-color); font-weight: 700; }
        
        .gauge-container {
            width: 100%; height: 14px; background: #1a1a26;
            border-radius: 7px; margin: 16px auto 12px auto; overflow: hidden;
        }
        .gauge-bar {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, #ff3e3e, #ffb703, #1dd1a1);
            transition: width 0.08s ease-out;
        }
        .msg-display { font-size: 1rem; font-weight: 700; height: 26px; color: var(--text-muted); margin-bottom: 16px; }
        
        .btn-reset {
            width: 100%; background: var(--accent-color); color: #0d0d13;
            border: none; padding: 14px; border-radius: 12px;
            font-size: 1.05rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 183, 3, 0.3);
            transition: background 0.2s; -webkit-tap-highlight-color: transparent;
        }
        .btn-reset:active { background: #e09f00; }
    </style>
</head>
<body>

    <div class="container">
        <h1>웃음대회 챌린지 👑</h1>
        <div class="subtitle">🔥 신의 영역: 999점 절대 유지 챌린지</div>
        
        <div class="video-wrapper">
            <div id="loader" class="overlay-loading">
                <div class="spinner"></div>
                <div style="font-size: 0.9rem; color: var(--text-muted);">대화면 초정밀 AI 엔진 구동 중...</div>
            </div>
            <video id="webcam" autoplay playsinline muted></video>
        </div>

        <div class="score-display-container">
            <div class="score-box">
                <span class="score-label">실시간 점수</span>
                <div>
                    <span class="score-number" id="score-value">0</span>
                    <span class="score-unit">점</span>
                </div>
            </div>
            <div class="score-box highlight">
                <span class="score-label">🔥 최고 기록</span>
                <div>
                    <span class="score-number" id="max-score-value">0</span>
                    <span class="score-unit">점</span>
                </div>
            </div>
        </div>

        <div class="gauge-container">
            <div class="gauge-bar" id="progress"></div>
        </div>

        <div class="msg-display" id="status">카메라 준비 중...</div>

        <button class="btn-reset" id="btn-next">다음 도전자 시작하기 🔄</button>
    </div>

    <script>
        const video = document.getElementById("webcam");
        const scoreEl = document.getElementById("score-value");
        const maxScoreEl = document.getElementById("max-score-value");
        const progressBar = document.getElementById("progress");
        const statusEl = document.getElementById("status");
        const loader = document.getElementById("loader");
        const nextBtn = document.getElementById("btn-next");

        let maxScore = 0;
        let currentSmoothedScore = 0; // 부드러운 점수 상승을 위한 변수

        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: false,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        faceMesh.onResults((results) => {
            loader.style.display = "none";

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                
                const mouthLeft = landmarks[61];
                const mouthRight = landmarks[291];
                const mouthTop = landmarks[13];     // 윗입술 안쪽 중앙
                const mouthBottom = landmarks[14];  // 아랫입술 안쪽 중앙
                const eyeLeft = landmarks[33];
                const eyeRight = landmarks[263];

                const mouthWidth = Math.hypot(mouthLeft.x - mouthRight.x, mouthLeft.y - mouthRight.y);
                const mouthHeight = Math.hypot(mouthTop.x - mouthBottom.x, mouthTop.y - mouthBottom.y);
                const eyeDist = Math.hypot(eyeLeft.x - eyeRight.x, eyeLeft.y - eyeRight.y);

                const smileRatio = mouthWidth / eyeDist; // 가로 미소 비율 (평균 0.45 ~ 0.75)
                const openRatio = mouthHeight / eyeDist;  // 세로 입벌림 비율 (평균 0.0 ~ 0.35)

                // [가로 웃음 55% + 세로 입벌림 45%] 비율로 융합연산
                let combinedTarget = (smileRatio * 0.55) + (openRatio * 0.45); 
                
                // 컷트라인 대폭 상향조정 (무표정 방어선 0.33)
                let rawProgress = (combinedTarget - 0.33) / 0.25; 
                if (rawProgress < 0) rawProgress = 0;
                if (rawProgress > 1) rawProgress = 1;

                // 5제곱 극악 연산 후 999점 환산
                let targetScore = Math.round(Math.pow(rawProgress, 5) * 999);

                // 💡 [핵심 수식] 댐핑 필터 적용: 순간적으로 999점이 튀는 걸 완벽 차단!
                // 현재 점수에서 목표 점수까지 매 프레임 15%씩만 접근하도록 조절 (약 0.7초 유지 필수)
                currentSmoothedScore = (currentSmoothedScore * 0.85) + (targetScore * 0.15);
                let score = Math.round(currentSmoothedScore);
                if (score > 999) score = 999;

                scoreEl.innerText = score;
                progressBar.style.width = `${(score / 999) * 100}%`;

                if (score > maxScore) {
                    maxScore = score;
                    maxScoreEl.innerText = maxScore;
                }

                // 999점 난이도 기준 리액션 멘트
                if (score < 80) {
                    statusEl.innerText = "입을 위아래로 더 크게 벌려 웃으세요! 😐";
                    statusEl.style.color = "#8e8e9f";
                } else if (score < 400) {
                    statusEl.innerText = "미소는 통하지 않습니다. 박장대소 하세요! 🙂";
                    statusEl.style.color = "#ff3e3e";
                } else if (score < 750) {
                    statusEl.innerText = "좋습니다! 표정을 더 우스꽝스럽게 파격적으로! 😀";
                    statusEl.style.color = "#ffb703";
                } else if (score < 980) {
                    statusEl.innerText = "우와아아! 그 표정을 유지하세요!! 버텨야 올라갑니다! 😆";
                    statusEl.style.color = "#1dd1a1";
                } else {
                    statusEl.innerText = "전설 달성! 진정한 대폭소의 왕 999점! 🎉👑";
                    statusEl.style.color = "#1dd1a1";
                }
            } else {
                statusEl.innerText = "화면을 제대로 바라봐 주세요.";
                statusEl.style.color = "#8e8e9f";
            }
        });

        nextBtn.addEventListener("click", () => {
            maxScore = 0;
            currentSmoothedScore = 0;
            maxScoreEl.innerText = "0";
            scoreEl.innerText = "0";
            progressBar.style.width = "0%";
            statusEl.innerText = "새로운 도전자! 999점에 도전하세요!";
            statusEl.style.color = "#ffb703";
        });

        const camera = new Camera(video, {
            onFrame: async () => { await faceMesh.send({ image: video }); },
            width: 640, height: 480
        });
        camera.start().catch(err => { alert("카메라를 켤 수 없습니다."); });
    </script>
</body>
</html>
